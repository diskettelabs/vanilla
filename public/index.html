<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanilla Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; }
#sidebar { width: 260px; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--background); flex-shrink: 0; }
#sidebar h1 { font-size: 16px; padding: 16px; border-bottom: 1px solid var(--border); color: var(--text); display: flex; align-items: center; gap: 8px; }
#search-area { padding: 8px; border-bottom: 1px solid var(--border); position: relative; }
#search-input { width: 100%; padding: 8px 12px 8px 30px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: var(--background); color: var(--text); outline: none; }
#search-input:focus { border-color: var(--primary); }
#search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); opacity: 0.4; font-size: 13px; pointer-events: none; }
#search-clear { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); display: none; cursor: pointer; opacity: 0.4; font-size: 14px; background: none; border: none; color: var(--text); padding: 2px; }
#search-clear:hover { opacity: 1; }
#conv-list { flex: 1; overflow-y: auto; padding: 8px; }
.conv-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; color: var(--text); font-size: 13px; }
.conv-item:hover { background: color-mix(in srgb, var(--primary) 30%, transparent); }
.conv-item.active { background: var(--primary); font-weight: 600; }
.conv-item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-item .meta { font-size: 11px; opacity: 0.6; margin-top: 2px; }
#search-results { flex: 1; overflow-y: auto; padding: 8px; display: none; }
.search-result { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 8px; color: var(--text); font-size: 13px; }
.search-result:hover { background: color-mix(in srgb, var(--primary) 30%, transparent); }
.search-result .title { font-weight: 600; margin-bottom: 4px; }
.search-result .snippet { font-size: 12px; opacity: 0.75; line-height: 1.5; margin-top: 4px; padding-left: 8px; border-left: 2px solid var(--border); }
.search-result .snippet mark { background: color-mix(in srgb, var(--primary) 60%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }
.search-result .snippet .role-tag { font-size: 10px; text-transform: uppercase; opacity: 0.4; letter-spacing: 0.5px; margin-right: 6px; }
.search-empty { padding: 24px; text-align: center; opacity: 0.4; font-size: 13px; }
#sidebar-footer { padding: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
#sidebar-footer select, #sidebar-footer button { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; background: var(--background); color: var(--text); cursor: pointer; }
#sidebar-footer button { background: var(--primary); border-color: var(--primary); font-weight: 600; }
#sidebar-footer button:hover { filter: brightness(0.9); }
#main { flex: 1; display: flex; flex-direction: column; background: var(--background); }
#messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; position: relative; }
.msg.user { align-self: flex-end; background: var(--userMessage); color: var(--text); border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--assistantMessage); color: var(--text); border-bottom-left-radius: 4px; }
.msg .role-label { font-size: 11px; font-weight: 600; opacity: 0.5; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.msg-actions { display: flex; gap: 6px; margin-top: 8px; opacity: 0; transition: opacity 0.15s; }
.msg:hover .msg-actions { opacity: 1; }
.msg-actions button { padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 11px; cursor: pointer; background: var(--background); color: var(--text); }
.msg-actions button:hover { background: var(--primary); }
#system-stats { display: flex; gap: 0; padding: 6px 16px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--background) 95%, var(--text)); font-size: 11px; cursor: default; user-select: none; }
.stat-item { display: flex; align-items: center; gap: 4px; padding: 2px 10px 2px 6px; border-radius: 4px; position: relative; }
.stat-item:hover { background: color-mix(in srgb, var(--primary) 20%, transparent); }
.stat-label { opacity: 0.5; font-weight: 600; letter-spacing: 0.3px; }
.stat-value { font-variant-numeric: tabular-nums; }
.stat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.stat-dot.low { background: #4caf50; }
.stat-dot.normal { background: #ffc107; }
.stat-dot.high { background: #ff9800; }
.stat-dot.extreme { background: #f44336; }
.stat-sep { width: 1px; background: var(--border); margin: 2px 4px; opacity: 0.3; }
.stat-tooltip { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--text); color: var(--background); padding: 8px 12px; border-radius: 6px; font-size: 11px; line-height: 1.5; white-space: nowrap; z-index: 100; pointer-events: none; }
.stat-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 4px solid transparent; border-top-color: var(--text); }
.stat-item:hover .stat-tooltip { display: block; }
#input-area { display: flex; gap: 8px; padding: 16px 20px; border-top: 1px solid var(--border); background: var(--background); align-items: flex-end; }
#input-area textarea { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; resize: none; font-size: 14px; font-family: inherit; background: var(--background); color: var(--text); outline: none; }
#input-area textarea:focus { border-color: var(--primary); }
#input-area button { padding: 10px 20px; border: none; border-radius: 8px; background: var(--primary); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
#input-area button:hover { filter: brightness(0.9); }
#input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
#input-area .stop-btn { background: #e74c3c; color: #fff; display: none; }
#input-area.streaming .send-btn { display: none; }
#input-area.streaming .stop-btn { display: inline-block; }
#empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text); opacity: 0.4; text-align: center; padding: 20px; }
#empty-state h2 { font-size: 24px; margin-bottom: 8px; }
#empty-state p { font-size: 14px; }
.loading-dots::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
.streaming-cursor { display: inline-block; width: 2px; height: 1em; background: var(--text); margin-left: 2px; animation: blink 0.8s step-end infinite; vertical-align: text-bottom; }
@keyframes blink { 50% { opacity: 0; } }
.error-msg { color: #e74c3c; font-size: 13px; padding: 8px 12px; background: color-mix(in srgb, #e74c3c 10%, transparent); border-radius: 6px; margin-top: 4px; }
</style>
</head>
<body>

<div id="sidebar">
  <h1>Vanilla Chat</h1>
  <div id="search-area">
    <span id="search-icon">🔍</span>
    <input id="search-input" type="text" placeholder="Search conversations…" autocomplete="off">
    <button id="search-clear">✕</button>
  </div>
  <div id="conv-list"></div>
  <div id="search-results"></div>
  <div id="sidebar-footer">
    <select id="provider-select"></select>
    <select id="model-select"></select>
    <select id="theme-select"></select>
    <button id="new-conv-btn">+ New Conversation</button>
  </div>
</div>

<div id="main">
  <div id="messages">
    <div id="empty-state">
      <h2>Vanilla Chat</h2>
      <p>Select a conversation or start a new one</p>
    </div>
  </div>
  <div id="system-stats"></div>
  <div id="input-area">
    <textarea id="input" rows="1" placeholder="Type a message..." disabled></textarea>
    <button id="send-btn" class="send-btn" disabled>Send</button>
    <button id="stop-btn" class="stop-btn">Stop</button>
  </div>
</div>

<script>
let currentConvId = null;
let models = [];
let streaming = false;
let providers = [];
let searchQuery = '';
const themes = {};

async function loadThemes() {
  const names = ['vanilla','chocolate','strawberry','mint','lemon','lime','peach','plum','raspberry','lavender','dragonfruit','dreamsicle','blue-moon','monochrome'];
  for (const name of names) {
    try {
      const r = await fetch(`/themes/${name}.json`);
      themes[name] = await r.json();
    } catch {}
  }
  const sel = document.getElementById('theme-select');
  sel.innerHTML = Object.values(themes).map(t => `<option value="${t.name}">${t.displayName || t.name}</option>`).join('');
  sel.value = 'vanilla';
  applyTheme('vanilla');
}

function applyTheme(name) {
  const t = themes[name];
  if (!t) return;
  const root = document.body.style;
  for (const [key, val] of Object.entries(t.colors)) {
    root.setProperty(`--${key}`, val);
  }
}

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!r.ok) { const e = await r.json().catch(() => ({ error: r.statusText })); throw new Error(e.error); }
  return r.json();
}

async function loadProviders() {
  try {
    providers = await api('/api/providers');
    const sel = document.getElementById('provider-select');
    sel.innerHTML = providers.map(p => `<option value="${p.id}">${p.label}</option>`).join('');
    sel.addEventListener('change', () => loadModelsForProvider(sel.value));
    await loadModelsForProvider(sel.value);
  } catch {
    document.getElementById('provider-select').innerHTML = '<option value="ollama">Ollama (Local)</option>';
  }
}

async function loadModelsForProvider(providerId) {
  try {
    const data = await api(`/api/models?provider=${providerId}`);
    models = Array.isArray(data) ? data : [];
    const sel = document.getElementById('model-select');
    sel.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
  } catch {
    document.getElementById('model-select').innerHTML = '<option value="">No models available</option>';
  }
}

async function loadConversations() {
  if (searchQuery) return;
  const list = await api('/api/conversations');
  const el = document.getElementById('conv-list');
  el.innerHTML = list.map(c => `
    <div class="conv-item${c.id === currentConvId ? ' active' : ''}" data-id="${c.id}">
      <div class="title">${esc(c.title)}</div>
      <div class="meta">${c.messageCount} msgs${c.provider ? ' · ' + c.provider : ''}</div>
    </div>
  `).join('');
  el.querySelectorAll('.conv-item').forEach(el => {
    el.addEventListener('click', () => selectConversation(el.dataset.id));
  });
}

function fuzzyCharMatch(query, text) {
  const q = query.toLowerCase();
  const t = text.toLowerCase();
  let qi = 0;
  for (let ti = 0; ti < t.length && qi < q.length; ti++) {
    if (t[ti] === q[qi]) qi++;
  }
  return qi === q.length;
}

function highlightText(text, query) {
  if (!query) return esc(text);
  const lower = text.toLowerCase();
  const q = query.toLowerCase();
  const parts = [];
  let lastEnd = 0;

  for (let i = 0; i < text.length; i++) {
    if (lower[i] === q[0]) {
      let qi = 1;
      let j = i + 1;
      while (qi < q.length && j < text.length) {
        if (lower[j] === q[qi]) qi++;
        j++;
      }
      if (qi === q.length) {
        if (i > lastEnd) parts.push(esc(text.slice(lastEnd, i)));
        parts.push('<mark>' + esc(text.slice(i, j)) + '</mark>');
        lastEnd = j;
        i = j - 1;
      }
    }
  }
  if (lastEnd < text.length) parts.push(esc(text.slice(lastEnd)));
  return parts.join('');
}

async function doSearch(query) {
  searchQuery = query;
  const convList = document.getElementById('conv-list');
  const resultsEl = document.getElementById('search-results');
  const clearBtn = document.getElementById('search-clear');

  if (!query.trim()) {
    searchQuery = '';
    convList.style.display = '';
    resultsEl.style.display = 'none';
    resultsEl.innerHTML = '';
    clearBtn.style.display = 'none';
    await loadConversations();
    return;
  }

  clearBtn.style.display = 'block';
  convList.style.display = 'none';
  resultsEl.style.display = 'block';
  resultsEl.innerHTML = '<div class="search-empty">Searching…</div>';

  try {
    const results = await api('/api/search?q=' + encodeURIComponent(query));
    if (!results.length) {
      resultsEl.innerHTML = '<div class="search-empty">No results found</div>';
      return;
    }

    resultsEl.innerHTML = results.map(r => {
      const snippets = (r.matches || []).filter(m => m.type === 'content').slice(0, 4).map(m => {
        const term = m.term || query;
        const highlighted = highlightText(m.snippet, term);
        return `<div class="snippet"><span class="role-tag">${m.role}</span>${highlighted}</div>`;
      }).join('');
      return `<div class="search-result" data-id="${r.id}">
        <div class="title">${esc(r.title)}</div>
        ${snippets}
      </div>`;
    }).join('');

    resultsEl.querySelectorAll('.search-result').forEach(el => {
      el.addEventListener('click', () => {
        document.getElementById('search-input').value = '';
        doSearch('');
        selectConversation(el.dataset.id);
      });
    });
  } catch (e) {
    resultsEl.innerHTML = '<div class="search-empty">Search failed: ' + esc(e.message) + '</div>';
  }
}

async function selectConversation(id) {
  currentConvId = id;
  const conv = await api(`/api/conversations/${id}`);
  document.querySelectorAll('.conv-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  if (conv.provider && document.getElementById('provider-select').value !== conv.provider) {
    document.getElementById('provider-select').value = conv.provider;
    await loadModelsForProvider(conv.provider);
  }
  renderMessages(conv.messages);
  enableInput(true);
  document.getElementById('input').focus();
  document.getElementById('empty-state').style.display = 'none';
}

function renderMessages(messages) {
  const el = document.getElementById('messages');
  const empty = document.getElementById('empty-state');
  if (!messages.length) {
    el.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  el.innerHTML = messages.map((m, i) => {
    if (m.role === 'system') return '';
    const isLastUser = m.role === 'user' && i === messages.length - 1;
    const isLastAsst = m.role === 'assistant' && i === messages.length - 1;
    const hasNextUser = m.role === 'assistant' && i + 1 < messages.length && messages[i + 1].role === 'user';
    return `<div class="msg ${m.role}" data-index="${i}">
      <div class="role-label">${m.role}</div>
      ${esc(m.content)}
      ${isLastUser ? `<div class="msg-actions">
        <button class="edit-and-resend-btn" data-id="${m.id}" data-content="${esc(m.content)}">Edit & Resend</button>
      </div>` : ''}
      ${isLastAsst ? `<div class="msg-actions">
        <button class="erase-btn">Erase</button>
      </div>` : ''}
      ${hasNextUser ? `<div class="msg-actions">
        <button class="erase-btn">Erase</button>
      </div>` : ''}
    </div>`;
  }).join('');

  el.querySelectorAll('.erase-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (streaming) return;
      try {
        await api(`/api/conversations/${currentConvId}/erase-last-response`, { method: 'POST' });
        const conv = await api(`/api/conversations/${currentConvId}`);
        renderMessages(conv.messages);
        await loadConversations();
      } catch (e) { alert('Failed to erase: ' + e.message); }
    });
  });

  el.querySelectorAll('.edit-and-resend-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (streaming) return;
      const inp = document.getElementById('input');
      inp.value = btn.dataset.content;
      inp.focus();
      inp.dispatchEvent(new Event('input'));
    });
  });

  el.scrollTop = el.scrollHeight;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function loadModels() {
  const provider = document.getElementById('provider-select').value || 'ollama';
  await loadModelsForProvider(provider);
}

async function sendMessage(text) {
  if (!currentConvId || streaming) return;
  streaming = true;
  const btn = document.getElementById('send-btn');
  const stopBtn = document.getElementById('stop-btn');
  const inp = document.getElementById('input');
  const inputArea = document.getElementById('input-area');
  btn.disabled = true;
  inp.disabled = true;
  inputArea.classList.add('streaming');

  const model = document.getElementById('model-select').value;
  const provider = document.getElementById('provider-select').value || 'ollama';
  const msgs = document.getElementById('messages');

  const userDiv = document.createElement('div');
  userDiv.className = 'msg user';
  userDiv.innerHTML = `<div class="role-label">user</div>${esc(text)}`;
  msgs.appendChild(userDiv);

  const asstDiv = document.createElement('div');
  asstDiv.className = 'msg assistant';
  asstDiv.innerHTML = '<div class="role-label">assistant</div>';
  const contentSpan = document.createElement('span');
  const cursor = document.createElement('span');
  cursor.className = 'streaming-cursor';
  asstDiv.appendChild(contentSpan);
  asstDiv.appendChild(cursor);
  msgs.appendChild(asstDiv);
  msgs.scrollTop = msgs.scrollHeight;

  const response = await fetch('/api/chat/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ conversationId: currentConvId, message: text, model, provider }),
  });

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let aborted = false;

  stopBtn.onclick = async () => {
    if (!currentConvId) return;
    try {
      await api(`/api/chat/stop/${currentConvId}`, { method: 'POST' });
      aborted = true;
    } catch {}
  };

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() || '';
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      try {
        const data = JSON.parse(line.slice(6));
        if (data.type === 'token') {
          contentSpan.textContent += data.content;
          msgs.scrollTop = msgs.scrollHeight;
        } else if (data.type === 'done') {
          cursor.remove();
          if (data.interrupted) {
            const note = document.createElement('div');
            note.style.cssText = 'font-size:11px;opacity:0.5;margin-top:4px;font-style:italic';
            note.textContent = 'Interrupted';
            asstDiv.appendChild(note);
          }
        } else if (data.type === 'error') {
          cursor.remove();
          const err = document.createElement('div');
          err.className = 'error-msg';
          err.textContent = 'Error: ' + data.error;
          asstDiv.appendChild(err);
        }
      } catch {}
    }
  }
  cursor.remove();

  streaming = false;
  btn.disabled = false;
  inp.disabled = false;
  inputArea.classList.remove('streaming');
  inp.value = '';
  inp.style.height = 'auto';
  inp.focus();
  loadConversations().then(() => {
    const conv = api(`/api/conversations/${currentConvId}`);
    return conv;
  }).then((conv) => {
    renderMessages(conv.messages);
  });
}

function enableInput(enabled) {
  document.getElementById('input').disabled = !enabled;
  document.getElementById('send-btn').disabled = !enabled;
}

// System stats
let statsInterval = null;

function pressureColor(p) {
  if (p === 'extreme') return 'extreme';
  if (p === 'high') return 'high';
  if (p === 'normal') return 'normal';
  return 'low';
}

function renderStats(stats) {
  const el = document.getElementById('system-stats');
  if (!stats) {
    el.innerHTML = '';
    return;
  }

  const cpuPct = stats.cpu.usagePercent != null ? stats.cpu.usagePercent.toFixed(1) + '%' : '—';
  const ramPct = stats.memory.pressurePercent != null ? stats.memory.pressurePercent + '%' : '—';
  const ramGB = stats.memory.physical ? stats.memory.physical.usedGB + '/' + stats.memory.physical.totalGB + ' GB' : '—';
  const gpuNames = (stats.gpu || []).map(g => g.name).join(', ');
  const npuLabel = stats.npu?.available ? 'ANE' : null;

  let gpuPct = null;
  if (stats.gpu && stats.gpu.length && stats.gpu[0].usagePercent != null) {
    gpuPct = stats.gpu[0].usagePercent.toFixed(0) + '%';
  }

  const cpuTooltip =
    'CPU: ' + stats.cpu.model + ' (' + stats.cpu.cores + ' cores)\n' +
    'Usage: ' + cpuPct + '\n' +
    'Pressure: ' + stats.cpu.pressure +
    (stats.cpu.loadAverage ? '\nLoad: ' + stats.cpu.loadAverage.map(n => n.toFixed(2)).join(', ') : '');

  const ramTooltip =
    'RAM: ' + ramGB + '\n' +
    'Pressure: ' + ramPct + '\n' +
    'Level: ' + stats.memory.pressure;

  let gpuTooltip = '';
  if (stats.gpu && stats.gpu.length) {
    const g = stats.gpu[0];
    gpuTooltip = 'GPU: ' + g.name +
      (g.chipset ? ' (' + g.chipset + ')' : '') +
      (g.vramTotalGB ? '\nVRAM: ' + g.vramTotalGB + ' GB' : '') +
      (g.metalFamily ? '\n' + g.metalFamily : '');
  }

  let html = '<div class="stat-item" title="' + esc(cpuTooltip) + '">' +
    '<span class="stat-dot ' + pressureColor(stats.cpu.pressure) + '"></span>' +
    '<span class="stat-label">CPU</span>' +
    '<span class="stat-value">' + cpuPct + '</span>' +
    '<div class="stat-tooltip">' + esc(cpuTooltip).replace(/\n/g, '<br>') + '</div>' +
    '</div>';

  html += '<div class="stat-sep"></div>';

  html += '<div class="stat-item" title="' + esc(ramTooltip) + '">' +
    '<span class="stat-dot ' + pressureColor(stats.memory.pressure) + '"></span>' +
    '<span class="stat-label">RAM</span>' +
    '<span class="stat-value">' + ramPct + '</span>' +
    '<div class="stat-tooltip">' + esc(ramTooltip).replace(/\n/g, '<br>') + '</div>' +
    '</div>';

  html += '<div class="stat-sep"></div>';

  html += '<div class="stat-item" title="' + esc(gpuTooltip || 'GPU') + '">' +
    '<span class="stat-dot low"></span>' +
    '<span class="stat-label">GPU</span>' +
    '<span class="stat-value">' + (gpuPct || gpuNames || '—') + '</span>' +
    (gpuTooltip ? '<div class="stat-tooltip">' + esc(gpuTooltip).replace(/\n/g, '<br>') + '</div>' : '') +
    '</div>';

  if (npuLabel) {
    html += '<div class="stat-sep"></div>';
    html += '<div class="stat-item" title="' + esc(stats.npu.name) + '">' +
      '<span class="stat-dot low"></span>' +
      '<span class="stat-label">NPU</span>' +
      '<span class="stat-value">' + npuLabel + '</span>' +
      '<div class="stat-tooltip">' + esc(stats.npu.name) + '<br>Available</div>' +
      '</div>';
  }

  el.innerHTML = html;
}

async function pollStats() {
  try {
    const stats = await api('/api/system/stats');
    renderStats(stats);
  } catch {
    // silently retry
  }
}

function initStats() {
  pollStats();
  statsInterval = setInterval(pollStats, 5000);
}

// Search
const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
let searchTimer = null;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(searchInput.value), 200);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchInput.value = '';
    doSearch('');
    searchInput.blur();
  }
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  doSearch('');
  searchInput.focus();
});

document.getElementById('new-conv-btn').addEventListener('click', async () => {
  const provider = document.getElementById('provider-select').value || 'ollama';
  const model = document.getElementById('model-select').value;
  await api('/api/conversations', { method: 'POST', body: JSON.stringify({ model, provider }) });
  await loadConversations();
  const list = await api('/api/conversations');
  if (list.length) selectConversation(list[0].id);
});

document.getElementById('send-btn').addEventListener('click', () => {
  const inp = document.getElementById('input');
  const text = inp.value.trim();
  if (text) {
    sendMessage(text);
  }
});

document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!streaming) document.getElementById('send-btn').click();
  }
});

document.getElementById('theme-select').addEventListener('change', (e) => {
  applyTheme(e.target.value);
});

document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 150) + 'px';
});

(async () => {
  await loadThemes();
  await loadProviders();
  await loadConversations();
  const list = await api('/api/conversations');
  if (list.length) selectConversation(list[0].id);
  initStats();
})();
</script>
</body>
</html>
