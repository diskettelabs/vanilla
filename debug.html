<!DOCTYPE html>
<html>
<head>
  <title>Debug localStorage</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    button { margin: 10px 5px; padding: 10px; }
    pre { background: #f0f0f0; padding: 10px; }
  </style>
</head>
<body>
  <h1>LocalStorage Debug</h1>
  
  <h2>Check Gemini Key</h2>
  <button onclick="checkKey()">Check vanilla-api-key-gemini</button>
  <pre id="keyResult"></pre>
  
  <h2>Set Test Key</h2>
  <input id="testKey" placeholder="Enter test API key" style="width: 300px;">
  <button onclick="setKey()">Set Key</button>
  
  <h2>All LocalStorage Keys</h2>
  <button onclick="showAll()">Show All Keys</button>
  <pre id="allKeys"></pre>
  
  <script>
    function checkKey() {
      const key = localStorage.getItem('vanilla-api-key-gemini');
      document.getElementById('keyResult').textContent = 
        key ? `Key exists: ${key.substring(0, 20)}...` : 'No key found';
    }
    
    function setKey() {
      const key = document.getElementById('testKey').value;
      if (key) {
        localStorage.setItem('vanilla-api-key-gemini', key);
        alert('Key saved!');
        checkKey();
      }
    }
    
    function showAll() {
      const keys = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        keys[key] = localStorage.getItem(key);
      }
      document.getElementById('allKeys').textContent = 
        JSON.stringify(keys, null, 2);
    }
    
    // Auto-check on load
    checkKey();
    showAll();
  </script>
</body>
</html>
