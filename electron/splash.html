<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vanilla</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,600,700,800,900&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: Satoshi, sans-serif;
    background: #faf7f2; color: #2b2b2b;
    -webkit-user-select: none; user-select: none;
    -webkit-app-region: drag;
  }
  .wordmark { font-size: 42px; font-weight: 700; letter-spacing: -1px; }
  .wordmark span { color: #b07a4d; }
  .spinner {
    margin-top: 26px; width: 22px; height: 22px;
    border: 3px solid #e7e1d8; border-top-color: #b07a4d; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { margin-top: 14px; font-size: 15px; color: #6b6b6b; }
  .track {
    display: none; margin-top: 20px; width: 280px; height: 6px;
    border-radius: 3px; background: #e7e1d8; overflow: hidden;
  }
  .bar { height: 100%; width: 0; border-radius: 3px; background: #b07a4d; transition: width 0.25s ease; }
  .pct { margin-top: 10px; font-size: 12px; color: #9a948c; font-variant-numeric: tabular-nums; }
  .error { margin-top: 18px; max-width: 380px; text-align: center; display: none; }
  .error-title { font-size: 17px; font-weight: 600; color: #a3423a; }
  .error-message { margin-top: 8px; font-size: 14px; line-height: 1.5; color: #6b6b6b; }
  .error-actions { margin-top: 18px; display: flex; gap: 10px; justify-content: center; }
  .error-btn {
    border-radius: 8px; padding: 9px 20px; font-size: 14px; font-weight: 600;
    background: #b07a4d; color: #fff; text-decoration: none;
    -webkit-app-region: no-drag;
  }
  .error-btn:hover { filter: brightness(1.08); }
  .error-btn.secondary { background: #e7e1d8; color: #4a4a4a; }
  .error-btn.secondary:hover { background: #ddd5c9; }
</style>
</head>
<body>
  <div class="wordmark">vanilla<span>.</span></div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Please wait, installing Ollama&hellip;</div>
  <div class="track" id="track"><div class="bar" id="bar"></div></div>
  <div class="pct" id="pct"></div>
  <div class="error" id="error">
    <div class="error-title">Vanilla can&rsquo;t start</div>
    <p class="error-message" id="errorMessage"></p>
    <div class="error-actions">
      <a class="error-btn" href="?action=retry">Retry</a>
      <a class="error-btn secondary" href="?action=quit">Quit</a>
    </div>
  </div>
  <script>
    function updateSplash(percent, message) {
      var track = document.getElementById('track');
      var bar = document.getElementById('bar');
      var pct = document.getElementById('pct');
      if (percent > 0 && percent < 100) {
        track.style.display = 'block';
        bar.style.width = percent + '%';
        pct.textContent = percent + '% · ' + message;
      } else if (percent >= 100) {
        track.style.display = 'block';
        bar.style.width = '100%';
        pct.textContent = message;
      } else {
        pct.textContent = message || '';
      }
    }
    function showError(message) {
      var spinner = document.getElementById('spinner');
      if (spinner) spinner.style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('errorMessage').textContent = message || 'Unknown error';
    }
  </script>
</body>
</html>
