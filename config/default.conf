# Vanilla Chat TUI Configuration

# Default theme (one of the 14 ice cream flavors)
DEFAULT_THEME="vanilla"

# Default Ollama model
DEFAULT_MODEL="llama2"

# Ollama API endpoint (must be localhost)
OLLAMA_API_URL="http://localhost:11434"

# Auto-save interval in seconds
AUTO_SAVE_INTERVAL=30

# Log level (DEBUG, INFO, WARN, ERROR, FATAL)
LOG_LEVEL="INFO"

# Data directory
DATA_DIR="${HOME}/.local/share/vanilla-chat-tui"

# Conversation storage directory
CONVERSATION_DIR="${DATA_DIR}/conversations"

# Log directory
LOG_DIR="${DATA_DIR}/logs"

# Maximum conversation tree size (number of nodes)
MAX_TREE_SIZE=10000

# Streaming token display latency target (milliseconds)
STREAM_LATENCY_TARGET=50

# System monitoring interval (milliseconds)
MONITOR_INTERVAL=1000

# Input timeout for responsiveness (milliseconds)
INPUT_TIMEOUT=100

# Target frame rate for TUI rendering
TARGET_FPS=60
